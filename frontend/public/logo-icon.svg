<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="auraGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebd5b3"/>
      <stop offset="35%" stop-color="#b89b72"/>
      <stop offset="70%" stop-color="#917349"/>
      <stop offset="100%" stop-color="#725a37"/>
    </linearGradient>
    <linearGradient id="auraDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222120"/>
      <stop offset="50%" stop-color="#141312"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="auraBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Luxury Crest Badge Base -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#auraDark)" stroke="url(#auraGold)" stroke-width="1.8"/>
  <rect x="8.5" y="8.5" width="83" height="83" rx="20.5" fill="none" stroke="url(#auraGold)" stroke-width="0.6" stroke-opacity="0.45"/>

  <!-- Subtle Radial Aura Ambient Glow -->
  <circle cx="50" cy="44" r="28" fill="url(#auraGold)" fill-opacity="0.14"/>

  <!-- Left Aerodynamic Wing of 'A' -->
  <path d="M 50 18 L 27 72 Q 26 75.5 29.5 75.5 L 36.5 75.5 Q 39.5 75.5 41 72 L 46.5 56.5 L 50 46 L 50 18 Z" fill="url(#auraGold)"/>

  <!-- Right Aerodynamic Wing of 'A' (Slightly Darker for 3D Mechanical Depth) -->
  <path d="M 50 18 L 73 72 Q 74 75.5 70.5 75.5 L 63.5 75.5 Q 60.5 75.5 59 72 L 53.5 56.5 L 50 46 L 50 18 Z" fill="url(#auraGold)" fill-opacity="0.82"/>

  <!-- Center Core Cutout -->
  <path d="M 50 27 L 39 65 L 43.5 65 L 50 47.5 L 56.5 65 L 61 65 Z" fill="#141312"/>

  <!-- Floating Precision Crossbar (Dynamic Aerodynamic Blade) -->
  <path d="M 32 58 C 42 55.5, 58 55.5, 68 58 L 65.5 61.5 C 56.5 59.5, 43.5 59.5, 34.5 61.5 Z" fill="url(#auraGold)"/>

  <!-- Center Aura Diamond (North Star of Excellence) -->
  <polygon points="50,33 54,42.5 50,52 46,42.5" fill="#ffffff" opacity="0.95"/>
  <polygon points="50,36 57.5,42.5 50,49 42.5,42.5" fill="#fde68a" opacity="0.8"/>
  <circle cx="50" cy="42.5" r="1.5" fill="#725a37"/>
</svg>
